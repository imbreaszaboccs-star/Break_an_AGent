services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2037"
      SCENARIO_DIFFICULTY: "expert"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "fd75e7d57d31066e10ffc0beda13626204118392f248bb1035bc60920c9b9e9d"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
