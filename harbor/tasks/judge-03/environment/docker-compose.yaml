services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2003"
      SCENARIO_DIFFICULTY: "easy"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "7a7aabfc23f25426304ae2892a90965da718b78c158cca4aaef738c9ddb0b6b9"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
