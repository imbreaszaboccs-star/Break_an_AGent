services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2003"
      SCENARIO_DIFFICULTY: "easy"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "02cf3ee456584dbc055742cbed729044aee9533af508c40654da5fd1a3338f32"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
