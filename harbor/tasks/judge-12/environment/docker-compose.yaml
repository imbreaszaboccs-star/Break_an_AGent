services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2012"
      SCENARIO_DIFFICULTY: "hard"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "9256507ecf676ac4ae8a307604b50e08d6ce2f36654636b7d89e7cdf33c39c23"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
