services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2012"
      SCENARIO_DIFFICULTY: "hard"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "493964f32c23dab613d17173354318de60b9ced8a98fc087211174322a04eb0f"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
