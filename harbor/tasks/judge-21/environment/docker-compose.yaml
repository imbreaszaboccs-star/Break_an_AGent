services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2021"
      SCENARIO_DIFFICULTY: "hard"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "91cb24e545f09fa6e8ef3312878f3de0f02616666e7beec04d0ed7ca2b387346"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
