services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2002"
      SCENARIO_DIFFICULTY: "easy"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "d0ec68267b7539d133b2434c6397b26526dfffea74b275b375773838aaf9d7f6"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
