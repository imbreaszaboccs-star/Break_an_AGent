services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2010"
      SCENARIO_DIFFICULTY: "medium"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "a2920c6f9880b897c4114d3dc78093e98690853f71e2884ec3c2b9629ef1961f"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
