services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2034"
      SCENARIO_DIFFICULTY: "expert"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "26bd55b56d68db3a32162a13fd23b159970728e6099fb185403191ac1bb3695c"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
