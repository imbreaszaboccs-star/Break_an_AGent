services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2033"
      SCENARIO_DIFFICULTY: "expert"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "d8750d959109c7188e0c2c763765401269807dafdc717c6f7b22a006dc203418"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
