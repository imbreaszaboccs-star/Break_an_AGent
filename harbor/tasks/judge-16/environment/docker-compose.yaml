services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2016"
      SCENARIO_DIFFICULTY: "hard"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "c35149c20c890adf2930dd6b9228dccbd5843296a80100c6068dd833877bc0b6"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
