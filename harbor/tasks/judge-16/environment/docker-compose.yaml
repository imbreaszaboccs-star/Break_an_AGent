services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2030"
      SCENARIO_DIFFICULTY: "expert"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "6ab72303cc8bdfc01c8493b2c192ddbd051a9feb69600d445ce881e9af031357"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
