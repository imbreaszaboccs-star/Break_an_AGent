services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2011"
      SCENARIO_DIFFICULTY: "medium"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "3b9253f5b2d98eb82b52aee6bf3fd18bf39881b87c7a76c967eac392f49843cd"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
