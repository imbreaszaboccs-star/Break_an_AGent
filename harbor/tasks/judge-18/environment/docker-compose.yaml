services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2032"
      SCENARIO_DIFFICULTY: "expert"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "5720bc474d7c60a8fe74ecfad3e2915ea837abeb3828b3c2d5d131bf22b0ec29"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
