services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2001"
      SCENARIO_DIFFICULTY: "medium"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "eb80f5e9c7005f9353036c12c63bc9c96c0b2d3d1a6cf825a90fbc0c544b556c"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
