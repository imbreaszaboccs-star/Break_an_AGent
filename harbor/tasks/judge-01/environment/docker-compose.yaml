services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2007"
      SCENARIO_DIFFICULTY: "medium"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "29c7789d6a0e2c99eaa85459cab2737cc9a06aaef50b59b0b2269cec79d9eb22"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
