services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2001"
      SCENARIO_DIFFICULTY: "easy"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "2ff021f28cb073103fee1b74fc9e99b1e18b57c797181398c0039f90fc8b2cae"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
