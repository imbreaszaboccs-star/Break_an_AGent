services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2000"
      SCENARIO_DIFFICULTY: "easy"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "f81df29f9987cc469411486d843691ea2d3ae3611afe329055c162e9751f9f5d"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
