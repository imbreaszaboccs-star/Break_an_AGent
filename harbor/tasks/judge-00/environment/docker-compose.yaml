services:
  main:
    build:
      context: ${CONTEXT_DIR}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      oncall-sim:
        condition: service_healthy
  oncall-sim:
    image: oncall-sim:local
    environment:
      SCENARIO_SEED: "2005"
      SCENARIO_DIFFICULTY: "medium"
      ONCALL_SALT: ""
      ADMIN_TOKEN_SHA256: "99887dd6443a02d5aef0a390e64e1970861e1e2417a03e5c68a1956771a511f5"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
