[project]
name = "oncall"
version = "0.1.0"
description = "OnCall: a deterministic incident-response RL environment (MCP)"
requires-python = ">=3.12"
dependencies = ["mcp>=1.20,<2"]

[project.scripts]
oncall = "oncall.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oncall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
